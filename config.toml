baseURL = "http://localhost:1313/"
languageCode = "en-us"
title = "[1697, 20747]"
theme = "PaperMod"
paginate = 10


[params]
  author = "Your Name"
  description = "Writing on Economics, Data Analytics, Computer Science & more."
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "Hi, I'm [1697, 20747]* 👋"
    Content = """
This is my personal webpage where I write about Economics, Data Analytics, Computer Science, and whatever else catches my attention within my domains of interest (minimal exertise).
I work with data across finance and comp science, and the usual open source systems. These are my notes made public.
Whilst the day job is finance, all my comp science is for the most part in my own time. i like my freedom.  
I hope the message is clear despite the informal phrasing, the text is not AI generated.
I am a pretty average programmer, my chosed domain of frustration is low level programming on small devices. For which i need to know quite a bit of machine learning.
You won't find me on social media, ever, this is it really unless you are on one of my very few whatsapp groups.

* tokenizer joke if that is your thing. If its not, you are probably in the wrong place.....
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/yourusername"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/bruce-schultz-19020039"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"
  [params.profileMode]
    enabled = true
    imageUrl = "/images/avatar.png"
    imageWidth = 120
    imageHeight = 120
  [params.assets]
    favicon = "/images/favicon.ico"
    disableHLJS = false

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNumbersInTable = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

