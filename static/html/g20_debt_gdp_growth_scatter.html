const COLORS = RAW.colors;
const NAMES  = RAW.names;
const scatter = RAW.scatter;
const allISO  = Object.keys(COLORS);
let hl = null;

function hex2rgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function buildDatasets(h){
  const ds = allISO.map(iso=>{
    const pts = scatter.filter(d=>d.country===iso).map(d=>({x:d.debt_gdp,y:d.gdp_growth,year:d.year}));
    const on  = h===null||h===iso;
    const c   = COLORS[iso];
    return {
      label: NAMES[iso]||iso, data:pts,
      backgroundColor: hex2rgba(c, on?0.72:0.06),
      borderColor:     hex2rgba(c, on?1.0:0.08),
      borderWidth:0.5,
      pointRadius: on?4:2,
      pointHoverRadius:6,
      order: on?1:2,
    };
  });
  ds.push({
    label:'OLS regression',
    data:[{x:RAW.reg_line.x[0],y:RAW.reg_line.y[0]},{x:RAW.reg_line.x[1],y:RAW.reg_line.y[1]}],
    type:'line', borderColor:'rgba(239,68,68,.85)', borderWidth:2,
    borderDash:[5,4], pointRadius:0, fill:false, tension:0, order:0,
  });
  return ds;
}

const ctx = document.getElementById('chart').getContext('2d');
const chart = new Chart(ctx,{
  type:'scatter',
  data:{datasets:buildDatasets(null)},
  options:{
    responsive:true, maintainAspectRatio:false,
    layout:{padding:{top:10,right:10,bottom:10,left:5}},
    plugins:{
      legend:{display:false},
      tooltip:{
        backgroundColor:'#1a2535',
        borderColor:'#253649', borderWidth:1,
        titleColor:'#94a3b8', bodyColor:'#e2e8f0',
        padding:10, cornerRadius:6,
        callbacks:{
          title: items => `${items[0].dataset.label} · ${items[0].raw.year||''}`,
          label: c => [` Debt/GDP: ${c.parsed.x.toFixed(1)}%`,` GDP growth: ${c.parsed.y.toFixed(2)}%`]
        }
      }
    },
    scales:{
      x:{
        grid:{color:'rgba(100,116,139,.12)'},
        border:{color:'rgba(100,116,139,.2)'},
        ticks:{color:'#64748b',font:{size:11}},
        title:{display:true,text:'Gross government debt / GDP  (%)',color:'#94a3b8',font:{size:12}}
      },
      y:{
        grid:{color:'rgba(100,116,139,.12)'},
        border:{color:'rgba(100,116,139,.2)'},
        ticks:{color:'#64748b',font:{size:11}},
        title:{display:true,text:'Real GDP growth  (%)',color:'#94a3b8',font:{size:12}},
        min:-16, max:22
      }
    }
  }
});

function setHL(iso){
  hl = (hl===iso)?null:iso;
  chart.data.datasets = buildDatasets(hl);
  chart.update('none');
  document.querySelectorAll('.ctry-btn').forEach(b=>{
    const on = hl===null||b.dataset.iso===hl;
    b.style.opacity = on?'1':'0.25';
    b.style.outline = b.dataset.iso===hl?`2px solid ${COLORS[b.dataset.iso]}`:'none';
  });
}
function resetHL(){
  hl=null;
  chart.data.datasets=buildDatasets(null);
  chart.update('none');
  document.querySelectorAll('.ctry-btn').forEach(b=>{b.style.opacity='1';b.style.outline='none';});
}

const legendBtns = document.getElementById('legendBtns');
allISO.forEach(iso=>{
  const b=document.createElement('button');
  b.className='ctry-btn'; b.dataset.iso=iso;
  b.style.borderColor=COLORS[iso];
  b.style.background=hex2rgba(COLORS[iso],.15);
  b.textContent=iso;
  b.onclick=()=>setHL(iso);
  legendBtns.appendChild(b);
});

const sorted=[...RAW.by_country].sort((a,b)=>a.r-b.r);
document.getElementById('tbody').innerHTML=sorted.map(d=>{
  const rCol = d.r<-0.3?'#f87171':d.r<0?'#fb923c':'#4ade80';
  const sigCol = d.p<0.05?'#10b981':'#475569';
  const bw = (Math.abs(d.r)*80).toFixed(1);
  const bc = d.r<0?'#f87171':'#4ade80';
  return `<tr onclick="setHL('${d.country}')">
    <td><span style="display:inline-flex;align-items:center;gap:7px;">
      <span style="width:8px;height:8px;border-radius:50%;background:${COLORS[d.country]};flex-shrink:0;"></span>
      <span style="color:#e2e8f0;">${d.name}</span>
    </span></td>
    <td style="text-align:right;font-weight:500;color:${rCol};">${d.r>=0?'+':''}${d.r.toFixed(3)}</td>
    <td style="text-align:right;color:${sigCol};">${d.p<0.05?'★ sig':'—'}</td>
    <td style="text-align:right;">${d.avg_debt.toFixed(1)}%</td>
    <td style="text-align:right;">${d.avg_growth.toFixed(2)}%</td>
    <td style="width:90px;">
      <div style="height:6px;background:#1e2d42;border-radius:3px;overflow:hidden;">
        <div style="height:100%;width:${bw}px;background:${bc};border-radius:3px;"></div>
      </div>
    </td>
  </tr>`;
}).join('');
</script>
