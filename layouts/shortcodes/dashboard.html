<div class="dashboard-container">
    <iframe 
        src="/dashboards/{{ .Get "name" }}.html"
        style="width:100%; height:{{ .Get "height" | default "700" }}px; border:none; border-radius:8px; margin: 20px 0;"
        title="{{ .Get "title" }}">
    </iframe>
</div>

<style>
.dashboard-container {
    margin: 30px 0;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
</style>
